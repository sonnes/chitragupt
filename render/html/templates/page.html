<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Transcript.Title}}{{.Transcript.Title}} — {{end}}chitragupt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
    <style>
        /* Prose styles for goldmark markdown output */
        .prose { font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; word-break: break-word; }
        .prose p { margin-bottom: 12px; }
        .prose p:last-child { margin-bottom: 0; }
        .prose h1 { font-size: 24px; font-weight: 700; margin: 20px 0 12px; }
        .prose h2 { font-size: 20px; font-weight: 600; margin: 16px 0 10px; }
        .prose h3 { font-size: 16px; font-weight: 600; margin: 14px 0 8px; }
        .prose strong { font-weight: 600; }
        .prose em { font-style: italic; }
        .prose code { font-family: ui-monospace, monospace; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #f1f5f9; }
        .prose pre { margin: 12px 0; border-radius: 8px; max-width: 100%; overflow-x: auto; }
        .prose pre code { padding: 0; background: transparent; }
        .prose ul { list-style: disc; margin: 8px 0; padding-left: 24px; }
        .prose ol { list-style: decimal; margin: 8px 0; padding-left: 24px; }
        .prose li { margin-bottom: 4px; }
        .prose blockquote { border-left: 3px solid #e2e8f0; padding-left: 12px; margin: 12px 0; color: #64748b; }
        .prose a { color: #2563eb; text-decoration: underline; }
        .prose table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
        .prose th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 600; }
        .prose td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
        .prose hr { border: none; border-top: 1px solid #e2e8f0; margin: 16px 0; }
        .plain-text { overflow-wrap: anywhere; word-break: break-word; }

        .timeline-shell { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        .timeline-list { counter-reset: timeline; position: relative; display: flex; flex-direction: column; gap: 6px; }
        .timeline-list::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 1px; background: linear-gradient(180deg, #cbd5e1, #e2e8f0); }
        .timeline-item { counter-increment: timeline; position: relative; min-width: 0; padding-left: 38px; }
        .timeline-item::before {
            content: counter(timeline);
            position: absolute;
            left: 0;
            top: 8px;
            z-index: 1;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #64748b;
            display: grid;
            place-items: center;
            font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .timeline-link {
            display: block;
            min-width: 0;
            border-radius: 8px;
            padding: 8px 10px;
            color: #475569;
            text-decoration: none;
            transition: background-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
        }
        .timeline-link:hover,
        .timeline-link:focus-visible {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04), 0 0 0 1px #e2e8f0;
            outline: none;
        }
        .timeline-link-text {
            display: -webkit-box;
            overflow: hidden;
            overflow-wrap: anywhere;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.35;
            max-height: 2.7em;
        }
        .timeline-duration { display: block; margin-top: 3px; color: #94a3b8; font-size: 11px; line-height: 1.2; }
        .relation-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 4px 10px;
            font: 700 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        .relation-pill.relation-root { background: #f1f5f9; color: #475569; }
        .relation-pill.relation-fork { background: #fffbeb; color: #b45309; }
        .relation-pill.relation-continuation { background: #eef2ff; color: #4f46e5; }
        .relation-pill.relation-subagent { background: #ecfeff; color: #0e7490; }
        .relation-pill.relation-unknown { background: #f4f4f5; color: #52525b; }
        .session-header {
            border-left: 4px solid #94a3b8;
            padding-left: 18px;
        }
        .session-header.relation-fork { border-left-color: #f59e0b; }
        .session-header.relation-continuation { border-left-color: #6366f1; }
        .session-header.relation-subagent { border-left-color: #0891b2; }
        .session-header.relation-unknown { border-left-color: #71717a; border-left-style: dashed; }

        /* Dark mode prose overrides */
        @media (prefers-color-scheme: dark) {
            .prose code { background: #1e293b; }
            .prose blockquote { border-color: #334155; color: #94a3b8; }
            .prose th { border-color: #334155; }
            .prose td { border-color: #334155; }
            .prose hr { border-color: #334155; }
            .prose a { color: #60a5fa; }
            .timeline-shell { scrollbar-color: #475569 transparent; }
            .timeline-list::before { background: linear-gradient(180deg, #334155, #1e293b); }
            .timeline-item::before { border-color: #475569; background: #0f172a; color: #94a3b8; }
            .timeline-link { color: #94a3b8; }
            .timeline-link:hover,
            .timeline-link:focus-visible { background: #1e293b; color: #f8fafc; box-shadow: 0 0 0 1px #334155; }
            .timeline-duration { color: #64748b; }
            .relation-pill.relation-root { background: #0f172a; color: #cbd5e1; }
            .relation-pill.relation-fork { background: rgba(120, 53, 15, 0.45); color: #fcd34d; }
            .relation-pill.relation-continuation { background: rgba(49, 46, 129, 0.55); color: #c7d2fe; }
            .relation-pill.relation-subagent { background: rgba(22, 78, 99, 0.55); color: #a5f3fc; }
            .relation-pill.relation-unknown { background: #27272a; color: #d4d4d8; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-700 dark:text-slate-300 font-sans" style="line-height: 1.65; padding: 48px 24px;">
    <div class="max-w-6xl mx-auto flex gap-8">
        <!-- Main content -->
        <div class="min-w-0 flex-1 max-w-3xl">
            {{template "header.html" .}}
            <div class="flex flex-col gap-8">
                {{range .Turns}}{{template "turn.html" .}}{{end}}
            </div>
            <footer class="mt-12 pt-6 border-t border-slate-200 dark:border-slate-700 text-center text-xs text-slate-400">
                Generated by <a href="https://github.com/sonnes/chitragupt" class="text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 underline">chitragupt</a>
            </footer>
        </div>
        <!-- Timeline sidebar -->
        <nav class="hidden xl:block w-72 shrink-0" aria-label="Session timeline">
            <div class="timeline-shell sticky top-8 max-h-[calc(100vh-4rem)] overflow-y-auto overflow-x-hidden pr-1">
                <div class="mb-4 flex items-end justify-between gap-3 border-b border-slate-200 dark:border-slate-700 pb-3">
                    <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-[0.18em]">Timeline</div>
                    <div class="font-mono text-[11px] text-slate-400 dark:text-slate-500">{{len .Turns}} turns</div>
                </div>
                <ol class="timeline-list">
                    {{range .Turns}}{{if .UserText}}
                    <li class="timeline-item">
                        <a href="#{{.ID}}" class="timeline-link">
                            <span class="timeline-link-text">{{.UserText}}</span>
                            {{if .Duration}}<span class="timeline-duration">{{.Duration}}</span>{{end}}
                        </a>
                    </li>
                    {{end}}{{end}}
                </ol>
            </div>
        </nav>
    </div>
    <script>
    (function() {
        function relativeTime(date) {
            var now = new Date();
            var seconds = Math.floor((now - date) / 1000);
            if (seconds < 60) return "just now";
            var minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + "m ago";
            var hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + "h ago";
            var days = Math.floor(hours / 24);
            if (days < 30) return days + "d ago";
            var months = Math.floor(days / 30);
            if (months < 12) return months + "mo ago";
            var years = Math.floor(days / 365);
            return years + "y ago";
        }
        document.querySelectorAll("time[datetime]").forEach(function(el) {
            var date = new Date(el.getAttribute("datetime"));
            if (!isNaN(date)) {
                el.textContent = relativeTime(date);
            }
        });
    })();
    </script>
</body>
</html>
